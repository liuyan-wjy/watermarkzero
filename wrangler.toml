name = "gemini-watermark-remover"
main = "./worker.mjs"
compatibility_date = "2026-04-15"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true

[vars]
SITE_ORIGIN = "https://watermarkzero.org"
GA4_MEASUREMENT_ID = "G-XV8TF2MBMM"

[[routes]]
pattern = "watermarkzero.org"
custom_domain = true

[[routes]]
pattern = "www.watermarkzero.org"
custom_domain = true
